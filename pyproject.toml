[build-system]
requires = ["setuptools", "cython", "setuptools-rust"]
build-backend = "setuptools.build_meta"

[project]
name = "pyroclastic"
version = "0.1"
authors = [ { name="Rémy O", email="remyoudompheng@gmail.com" } ]
description = "Computation of quadratic class groups"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]

dependencies = [
  "python-flint>=0.7",
  "kp==0.9.0",
  "opentelemetry-exporter-otlp-proto-http",
  "tqdm>=4.0",
  "networkx>=3.2",
  "pymqs @ https://github.com/remyoudompheng/yamaquasi/releases/download/0.3/pymqs-0.3-cp37-abi3-manylinux_2_28_x86_64.whl#sha256=51116230be394e90c92eba9bd2d159a137712e9f18ff7e60239547514f4f54b5 ; platform_system=='Linux' and platform_machine=='x86_64'"
]

[project.optional-dependencies]
dev = ["pytest", "mypy", "types-networkx", "types-tqdm"]

[project.scripts]
pyroclastic = "pyroclastic.__main__:main"
pyroclastic-sieve = "pyroclastic.sieve:main"
pyroclastic-sievechk = "pyroclastic.sieve:check"
pyroclastic-relations = "pyroclastic.relations:main"
pyroclastic-linalg = "pyroclastic.linalg:main"
pyroclastic-groupstruct = "pyroclastic.groupstruct:main"
pyroclastic-smoothrel = "pyroclastic.smoothrel:main"
pyroclastic-factor = "pyroclastic.factor.__main__:main"

[tool.setuptools]
ext-modules = [{name = "pyroclastic_flint_extras", sources = ["pyroclastic/pyroclastic_flint_extras.pyx"], libraries = ["flint"]}]

[[tool.setuptools-rust.ext-modules]]
target = "pyroclastic.pyroclastic_rust"
debug = false

[tool.setuptools.packages.find]
include = ['pyroclastic']

[tool.setuptools.package-data]
pyroclastic = ["*.comp"]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
pythonpath = ["."]

[tool.ruff.lint]
# It's okay to name variables 'l'
ignore = ["E741"]
